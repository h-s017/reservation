# GitHub Pages frontend; public Worker API and callbacks. DNS remains unchanged.
name = "hana-course-production"
main = "src/index.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[vars]
NEWEBPAY_ENV = "production"
NEWEBPAY_ATM_ENABLED = "true"
NEWEBPAY_INSTALLMENTS = "0"
NEWEBPAY_LINEPAY_ENABLED = "false"
SITE_ORIGIN = "https://reservation.hanascent.com"
# Backoffice is a module within HANA WORKSPACE GitHub Pages (admin bearer auth still required).
HANA_WORKSPACE_ORIGIN = "https://h-s017.github.io"
# Optional schedule buffers; only a dedicated calendar is synchronized.
GCAL_BUFFER_BEFORE_MINUTES = "0"
GCAL_BUFFER_AFTER_MINUTES = "0"
# Use the EXISTING Google Calendar with conservative course/all-day review rules.
# GCAL_BUSY_CALENDAR_ID must be the user calendar ID (NOT the service account "primary").
GCAL_SYNC_MODE = "primary_review"
# Notifications are opt-in. No messages sent until recipient and provider credentials are authorized.
NOTIFICATIONS_ENABLED = "false"
# Private Worker secrets are documented in docs/NOTIFICATIONS_SETUP.md
# Cloudflare secrets: GCAL_SERVICE_ACCOUNT_JSON and GCAL_BUSY_CALENDAR_ID
# Replace with the deployed HTTPS Worker origin, without a trailing slash.
PUBLIC_ORIGIN = "https://hana-course-production.hana-reservation-payment.workers.dev"
# Secrets (wrangler secret put): NEWEBPAY_MERCHANT_ID, NEWEBPAY_HASH_KEY,
# NEWEBPAY_HASH_IV, ADMIN_TOKEN. Never put values here.

[[d1_databases]]
binding = "DB"
database_name = "hana-course-production"
database_id = "7a3c2179-7ed6-485e-b450-82add22aac06"
migrations_dir = "migrations"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[build]
command = "node ../scripts/build-worker-assets.mjs"

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = false



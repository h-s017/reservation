name: Restore poster hover zoom

on:
  push:
    paths:
      - '.github/workflows/restore-poster-hover-zoom.yml'

permissions:
  contents: write

jobs:
  restore-hover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore desktop poster hover zoom
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = ".contest-poster{display:block;width:100%;height:auto;margin:0 0 28px;border:1px solid #ddd}"
          new = ".contest-poster{display:block;width:100%;height:auto;margin:0 0 28px;border:1px solid #ddd;transition:transform .25s ease,box-shadow .25s ease;transform-origin:center top;position:relative;z-index:1;cursor:zoom-in}@media(hover:hover) and (pointer:fine){.contest-poster:hover{transform:scale(1.3);z-index:20;box-shadow:0 18px 45px rgba(0,0,0,.22)}}"

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one poster style match, found {count}')

          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit and push update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Restore poster hover zoom"
          git push origin HEAD:main

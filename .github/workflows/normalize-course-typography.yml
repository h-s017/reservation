name: Normalize course typography

on:
  push:
    paths:
      - '.github/workflows/normalize-course-typography.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Step 02 typography
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = ".name{font-size:19px;font-weight:500;letter-spacing:.04em}.meta{font-size:14px;margin-top:3px}.mark,.state{font-size:13px;letter-spacing:.12em;white-space:nowrap}"
          new = ".name,.stime{font-size:19px;font-weight:500;line-height:1.45;letter-spacing:.04em}.meta{font-size:14px;margin-top:3px}.mark,.state{font-size:13px;letter-spacing:.12em;white-space:nowrap}"
          if old not in text:
              raise SystemExit('Expected .name typography rule not found')
          text = text.replace(old, new, 1)

          old = ".time-title{margin-top:30px;border-bottom:1px solid #000;padding-bottom:9px;font-size:15px;letter-spacing:.1em}.stime{font-size:21px}.price{font-size:15px;flex:1}"
          new = ".time-title{margin-top:30px;border-bottom:1px solid #000;padding-bottom:9px;font-size:15px;letter-spacing:.1em}.price{font-size:15px;flex:1}"
          if old not in text:
              raise SystemExit('Expected .stime typography rule not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Normalize reservation course typography"
          git push

name: Deploy reservation production Worker

on:
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - 'admin.js'
      - 'admin.css'
      - 'index.html'
      - 'payment.js'
      - 'assets/**'
      - 'payment-worker/**'
      - 'scripts/build-worker-assets.mjs'
      - '.github/workflows/deploy-production-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hana-course-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and payment tests
        run: |
          node scripts/check-course-prices.mjs
          node --test payment-worker/test/*.test.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Install Wrangler
        working-directory: payment-worker
        run: pnpm install --frozen-lockfile
      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub's production environment secrets before deploying."
            exit 1
          fi
      - name: Deploy production Worker and static assets
        working-directory: payment-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.production.toml
      - name: Verify admin asset is reachable
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "https://hana-course-production.hana-reservation-payment.workers.dev/admin" -o /dev/null

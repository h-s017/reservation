name: Payment safety tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-course-prices.mjs
      - run: node --test payment-worker/test/*.test.mjs
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:42f02d323c310069b4d54c94bd91a608966a486c3492c48ae0b1cea747ec5ca2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser harness in isolated directory
        run: npm install --prefix .browser-test --ignore-scripts --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
      - name: Synthetic customer and admin regression (no production credentials)
        env:
          NODE_PATH: ${{ github.workspace }}/.browser-test/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          SCREENSHOT_DIR: test-results/browser
        run: |
          node payment-worker/test/browser.cjs
          node payment-worker/test/admin-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reservation-browser-evidence
          path: test-results/browser/
          if-no-files-found: warn
          retention-days: 7

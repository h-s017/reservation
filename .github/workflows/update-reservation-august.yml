name: Update reservation calendar start

on:
  push:
    paths:
      - '.github/workflows/update-reservation-august.yml'

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set reservation start to August 2026
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "START:'2026-07-09T10:00:00+08:00'"
          new = "START:'2026-08-01T10:00:00+08:00'"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one matching start date, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit and push update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Start reservation calendar in August"
          git push origin HEAD:main

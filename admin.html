<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>課程管理｜HANA SCENT ARTIST</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head><body><main>
<h1>HANA SCENT ARTIST｜課程管理</h1><form id="login"><label>管理金鑰 <input id="key" type="password" autocomplete="off" required minlength="32"></label><button>登入</button><p>金鑰只在此頁記憶體使用，重新整理後需重新登入。</p></form><p id="message" role="status"></p>
<div id="panel" hidden><nav><button id="calendarTab" type="button">預約月曆</button><button id="orders">訂單</button><button id="slots">場次與名額</button><button id="export">匯出目前訂單 CSV</button><button id="logout">登出</button></nav>
<section id="calendarPanel"><div class="cal-header"><button id="monthPrev" type="button">‹ 上個月</button><strong id="monthTitle"></strong><button id="monthNext" type="button">下個月 ›</button></div><div class="cal-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="monthGrid" class="cal-grid" aria-label="預約日期月曆"></div><p>可預約＝已有場次、尚有名額、距開課至少 36 小時且未禁約；僅解除禁約不會自動新增場次。</p><div id="dateDetails"><h2 id="selectedDateTitle">請選擇日期</h2><p id="selectedDateState"></p><form id="newSlotForm"><label>課程 <select id="newCourse" required></select></label><label>開始時間 <input id="newTime" type="time" required value="10:00"></label><label>名額 <input id="newCapacity" type="number" min="1" max="100" value="1" required></label><button type="submit">新增課程場次</button></form><div id="dateSlots"></div></div></section><form id="dateForm"><label>預約日期管理 <input type="date" id="date" required></label><button type="submit" id="closeDate">關閉整日預約</button> <button type="button" id="openDate">開放整日預約</button><p>開放整日預約只移除所選日期的手動禁約；不會變更已成立訂單、場次狀態或容量，其他限制仍然生效。</p></form>
<label>場次日期篩選 <input type="date" id="filter"></label><div class="table"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><button id="older" hidden>載入更早訂單</button><p>未決交易不可直接取消；先確認藍新交易結果。已付款可登記取消申請；請先另行完成實際退款，再確認全額退款以釋放名額。本頁不會執行退款匯款。</p></div></main></body></html>
